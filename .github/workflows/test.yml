name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python examples/make_fixture.py "$RUNNER_TEMP/synthetic.xlsx"
      - run: python themebridge.py "$RUNNER_TEMP/synthetic.xlsx" --output "$RUNNER_TEMP/repaired.xlsx"
